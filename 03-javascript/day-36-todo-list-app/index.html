<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 36 - Todo List App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-container">
      <section class="todo-card">
        <h1>Todo List App</h1>

        <p class="subtitle">
          Practice JavaScript DOM, events, arrays, and functions.
        </p>

        <div class="todo-form">
          <input type="text" id="task-input" placeholder="Enter a new task" />

          <button id="add-task-btn">Add Task</button>
        </div>

        <p class="helper-text">Press Add Task after typing your task.</p>

        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search tasks..." />
        </div>

        <div class="filter-buttons">
          <button class="filter-btn active-filter" data-filter="all">
            All
          </button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <p id="task-status" class="task-status">Add your first task.</p>

        <ul id="task-list" class="task-list"></ul>

        <button id="clear-all-btn" class="clear-all-btn">
          Clear All Tasks
        </button>

        <button id="clear-completed-btn" class="clear-completed-btn">
          Clear Completed Tasks
        </button>
        <button id="clear-completed-btn" class="clear-all-btn">
          Clear Completed Tasks
        </button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
