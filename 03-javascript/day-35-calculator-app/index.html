<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 35 - Calculator App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container">
    <section class="calculator-card">
      <h1>Simple Calculator</h1>

      <p class="subtitle">
        Practice JavaScript functions, events, and calculations.
      </p>

      <div class="input-group">
        <label for="first-number">First Number</label>
        <input type="number" id="first-number" placeholder="Enter first number">
      </div>

      <div class="input-group">
        <label for="second-number">Second Number</label>
        <input type="number" id="second-number" placeholder="Enter second number">
      </div>

      <div class="button-group">
        <button id="add-btn">Add</button>
        <button id="subtract-btn">Subtract</button>
        <button id="multiply-btn">Multiply</button>
        <button id="divide-btn">Divide</button>
        <button id="percentage-btn">Percentage</button>
        <button id="clear-btn" class="clear-btn">Clear</button>

      </div>

      <p id="result-message" class="result-message">
        Result will appear here.
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
